# Torii Call nginx fragment — install to /opt/torii/nginx-fragments/call.conf
# Mounts the call app at /call/ on the shared host. The Node server strips the
# /call prefix via BASE_PATH, and the full path (static + /call/ws + /call/ice-servers)
# is proxied to 127.0.0.1:3001.
location /call/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # The host layer blocks camera/microphone site-wide (Permissions-Policy
    # geolocation=(), microphone=(), camera=()). Re-enable them here, otherwise
    # getUserMedia fails with NotAllowedError and the call never starts.
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;
}

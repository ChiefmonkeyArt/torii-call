# coturn config for Torii Call TURN relay.
# TURN lets calls succeed through symmetric NAT / strict firewalls.
# Replace the secret + realm with your own; keep the secret out of the repo's
# shipped files (see deploy/README note).

listening-port=3478
lt-cred-mech
realm=torii-call

# Long-term credential (set TURN_USER / TURN_PASS on the signaling server to match).
user=torii:__CHANGE_TURN_PASSWORD__

fingerprint
no-cli
